services:
  nex:
    image: ${NEX_IMAGE:?Set an explicit image tag or digest}
    init: true
    user: "10001:10001"
    ports:
      - "127.0.0.1:${NEX_HTTP_PORT:?Set a dedicated host port}:3210"
    environment:
      HOME: /home/nex
      CODEX_HOME: /home/nex/.codex
      NEX_RUNTIME_PROFILE: prod
      NEX_DEFAULT_PROVIDER: codex
      NEX_PROJECTS_DIR: /workspace/projects
      NODE_ENV: production
      NEX_TRUST_PROXY: true
      TZ: Asia/Hong_Kong
      NEX_PASSWORD: ${NEX_PASSWORD:?Set a random password}
    volumes:
      - type: bind
        source: ${NEX_DATA_ROOT:?Set the environment data directory}/nex
        target: /home/nex/.nex
        bind:
          create_host_path: false
      - type: bind
        source: ${NEX_DATA_ROOT:?Set the environment data directory}/codex
        target: /home/nex/.codex
        bind:
          create_host_path: false
      - type: bind
        source: ${NEX_DATA_ROOT:?Set the environment data directory}/projects
        target: /workspace/projects
        bind:
          create_host_path: false
    restart: unless-stopped
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "bun", "-e", "const r=await fetch('http://127.0.0.1:3210/health',{signal:AbortSignal.timeout(4000)}); if(!r.ok || !(await r.json()).ok) process.exit(1)"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
