services:
  nex:
    image: nex-web:${NEX_IMAGE_TAG:-local}
    build:
      context: .
      args:
        BUN_VERSION: "1.4.2"
        CODEX_VERSION: "0.162.0-alpha.2"
    init: true
    user: "10001:10001"
    ports:
      - "127.0.0.1:${NEX_HTTP_PORT:-3210}:3210"
    environment:
      HOME: /home/nex
      CODEX_HOME: /home/nex/.codex
      NEX_RUNTIME_PROFILE: prod
      NEX_DEFAULT_PROVIDER: codex
      NEX_PROJECTS_DIR: /workspace/projects
      NODE_ENV: production
      NEX_PASSWORD: ${NEX_PASSWORD:-}
    volumes:
      - type: bind
        source: ${NEX_DATA_ROOT:-/srv/nex/data}/nex
        target: /home/nex/.nex
        bind:
          create_host_path: false
      - type: bind
        source: ${NEX_DATA_ROOT:-/srv/nex/data}/codex
        target: /home/nex/.codex
        bind:
          create_host_path: false
      - type: bind
        source: ${NEX_DATA_ROOT:-/srv/nex/data}/projects
        target: /workspace/projects
        bind:
          create_host_path: false
    restart: unless-stopped
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "bun", "-e", "const r=await fetch('http://127.0.0.1:3210/health',{signal:AbortSignal.timeout(4000)}); if(!r.ok || !(await r.json()).ok) process.exit(1)"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
